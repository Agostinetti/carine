  if(S.lives>=MAXLIVES){S.lives=MAXLIVES;S.livesTs=Date.now();return;}

function tn(f,d,o){
  o=o||{};const c=AU.ctx;if(!c)return;const t=c.currentTime+(o.at||0);
  const os=c.createOscillator(),g=c.createGain();os.type=o.type||"square";os.frequency.setValueAtTime(f,t);
  if(o.to)os.frequency.exponentialRampToValueAtTime(o.to,t+d);
  if(o.vib){const l=c.createOscillator(),lg=c.createGain();l.frequency.value=o.vib;lg.gain.value=o.vibd||f*.03;l.connect(lg);lg.connect(os.frequency);l.start(t);l.stop(t+d+.05);}
  const v=o.vol||.08;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+(o.att||.006));g.gain.exponentialRampToValueAtTime(.0001,t+d);
  os.connect(g);g.connect(o.dest||AU.fx);os.start(t);os.stop(t+d+.05);
}
function nz(d,o){
  o=o||{};const c=AU.ctx;if(!c)return;const t=c.currentTime+(o.at||0);

  s.connect(f);f.connect(g);g.connect(o.dest||AU.fx);s.start(t);s.stop(t+d+.02);
}

function musStart(){if(!AU.ctx||MUS.iv)return;MUS.step=0;MUS.next=AU.ctx.currentTime+.15;MUS.iv=setInterval(musTick,25);}
function musStop(){if(MUS.iv){clearInterval(MUS.iv);MUS.iv=null;}}
function tension(){
  if(state!=="play")return 0;let d=99;
  for(const w of wolves){if(w.mode==="chase"||w.mode==="leave"){d=Math.min(d,Math.hypot(px(w)-px(girl),py(w)-py(girl)));}}
  return Math.max(0,Math.min(1,(6.5-d)/5));
}
function musTick(){
  const c=AU.ctx;if(!c)return;
  AU.ten+=(tension()-AU.ten)*.08;const ten=AU.ten,pw=power>0;
  const bpm=pw?150:(state==="play"?96+ten*56:84);const sp=60/bpm/2;
  while(MUS.next<c.currentTime+.12){
    const s=MUS.step%32,at=Math.max(0,MUS.next-c.currentTime);
    const n=(pw?HERO:MEL)[s];const b=(pw?HBASS:BASS)[(s/4)|0];
    if(n)tn(mtof(n),sp*1.7,{at,type:pw?"square":"triangle",vol:pw?.04:.055,dest:AU.mus});
    if(s%4===0)tn(mtof(b),sp*3.6,{at,type:"sine",vol:.13,dest:AU.mus});
    if(state==="play"){
      if(s%8===0||(ten>.5&&s%4===0))tn(130,.14,{at,type:"sine",to:45,vol:.16,dest:AU.mus});
      if(pw||ten>.3){if(s%2===1)tn(mtof(b+12),sp*.8,{at,type:"square",vol:pw?.03:.035*ten,dest:AU.mus});nz(.035,{at,vol:.015+.03*ten,dest:AU.mus});}
      if(!pw&&ten>.6&&s%8===0)tn(mtof(77),sp*7,{at,type:"sawtooth",vol:.018,vib:12,vibd:6,dest:AU.mus});
    }
    MUS.next+=sp;MUS.step++;
  }
}

const clipCache={};
function loadClips(){if(!AU.ctx)return;for(const k in VOICE_CLIPS){const src=VOICE_CLIPS[k];if(!src||clipCache[k])continue;clipCache[k]="loading";
  try{const bin=atob(src.split(",")[1]);const u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);
    AU.ctx.decodeAudioData(u.buffer,b=>{clipCache[k]=b;},()=>{clipCache[k]=null;});}catch(e){clipCache[k]=null;}}}
function playClip(txt){const src=VOICE_CLIPS[txt];if(!src)return false;if(AU.ctx&&AU.ctx.state!=="running"){try{AU.ctx.resume();}catch(e){}}const b=clipCache[txt];
  if(AU.ctx&&AU.ctx.state!=="running"&&unlockEl&&unlockEl.dataset.ok){try{unlockEl.currentTime=0;unlockEl.play();return true;}catch(e){}}
  if(AU.ctx&&b&&b!=="loading"){try{const n=AU.ctx.createBufferSource();n.buffer=b;const g=AU.ctx.createGain();g.gain.value=1.6;n.connect(g);g.connect(AU.m);
    const t=AU.ctx.currentTime;AU.mus.gain.setValueAtTime(.32,t);AU.mus.gain.linearRampToValueAtTime(.08,t+.05);AU.mus.gain.setValueAtTime(.08,t+b.duration);AU.mus.gain.linearRampToValueAtTime(.32,t+b.duration+.4);
    n.start();return true;}catch(e){}}
  try{const a=(txt==="Vas-y mon Loulou !"&&unlockEl&&unlockEl.dataset.ok)?unlockEl:new Audio(src);a.muted=false;a.volume=1;a.currentTime=0;a.play().catch(()=>{});return true;}catch(e){return false;}}
function speakPart(t,pitch,rate,vol){const u=new SpeechSynthesisUtterance(t);u.lang="fr-FR";u.pitch=pitch;u.rate=rate;u.volume=vol||1;if(frVoice)u.voice=frVoice;speechSynthesis.speak(u);}
function say(txt,voice){
  bubble={txt,t:2.4};
  if(!voice||!S.snd)return;
  if(playClip(txt))return;
  if(!window.speechSynthesis)return;
  try{speechSynthesis.cancel();
    if(txt==="Vas-y mon Loulou !"){speakPart("Vas-y !",1.45,1.12);speakPart("mon Loulou !",1.15,.92);}
    else speakPart(txt,1.25,1.02);
  }catch(e){}
}

function cfg(n){
  const r=rng(n*7919+13);
  const f=1-Math.exp(-(n-1)/160);
  const hard=n%10===0,breather=n%10===3;
  let d=f+(hard?.13:0)-(breather?.07:0);d=Math.max(0,Math.min(1.12,d));
  const dc=Math.min(1,d);
  return{n,hard,d,
    wolves:n<3?2:(n<25?3:4),
    wolfSpeed:Math.min(5.5,3.9+1.55*d),
    smart:.5+.42*dc,
    power:7.5-3.5*dc,
    release:Math.max(1.1,3.4-2*dc),
    chrono:n>=6&&r()<.3+.25*f,
    timeFactor:2.3-.8*dc,
    pickupEvery:9+6*dc,
    theme:THEMES[Math.floor((n-1)/PER)%THEMES.length]};
}
function genMaze(n){
  if(n===1)return{g:MAP1.map(r=>r.split("")),sx:9,sy:15};
  const R=rng(n*977+31337);
  const g=[];for(let y=0;y<ROWS;y++)g.push(new Array(COLS).fill("#"));
  const set=(x,y,v)=>{g[y][x]=v;g[y][COLS-1-x]=v;};
  const seen={"9,19":1};const st=[[9,19]];g[19][9]=" ";
  while(st.length){
    const[x,y]=st[st.length-1];const nb=[];
    for(const[dx,dy]of[[2,0],[-2,0],[0,2],[0,-2]]){const nx=x+dx,ny=y+dy;if(nx>=1&&nx<=9&&ny>=1&&ny<=19&&!seen[nx+","+ny])nb.push([nx,ny,dx,dy]);}
    if(!nb.length){st.pop();continue;}
    const[nx,ny,dx,dy]=nb[R()*nb.length|0];g[y+dy/2][x+dx/2]=" ";g[ny][nx]=" ";seen[nx+","+ny]=1;st.push([nx,ny]);
  }
  for(let y=0;y<ROWS;y++)for(let x=0;x<9;x++)g[y][COLS-1-x]=g[y][x];
  for(let y=7;y<=11;y++)for(let x=6;x<=12;x++)g[y][x]=" ";
  for(let x=7;x<=11;x++){g[8][x]="#";g[10][x]="#";}
  g[9][7]="#";g[9][11]="#";g[9][8]=g[9][9]=g[9][10]="W";g[8][9]="-";
  const prot=(x,y)=>x<=0||y<=0||x>=COLS-1||y>=ROWS-1||(x>=7&&x<=11&&y>=8&&y<=10);
  const op=(x,y)=>g[y][x]!=="#";
  for(let pass=0;pass<8;pass++){let ch=false;
    for(let y=1;y<ROWS-1;y++)for(let x=1;x<=9;x++){
      if(!op(x,y)||prot(x,y))continue;let c=0;for(const[dx,dy]of DLIST)if(op(x+dx,y+dy))c++;
      if(c>1)continue;
      const o=DLIST.filter(([dx,dy])=>{const wx=x+dx,wy=y+dy,bx=x+2*dx,by=y+2*dy;return!prot(wx,wy)&&g[wy][wx]==="#"&&bx>0&&by>0&&bx<COLS-1&&by<ROWS-1&&op(bx,by)&&!prot(bx,by);});
      if(o.length){const[dx,dy]=o[R()*o.length|0];set(x+dx,y+dy," ");ch=true;}
    }
    if(!ch)break;}
  const extra=2+(R()*5|0);
  for(let k=0,tries=0;k<extra&&tries<300;tries++){
    const x=1+(R()*9|0),y=1+(R()*19|0);if(g[y][x]!=="#"||prot(x,y))continue;
    const h=op(x-1,y)&&op(x+1,y)&&!op(x,y-1)&&!op(x,y+1),v=op(x,y-1)&&op(x,y+1)&&!op(x-1,y)&&!op(x+1,y);
    if(h||v){set(x,y," ");k++;}
  }
  for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++)if(g[y][x]===" ")g[y][x]=".";
  for(const[x,y]of[[1,1],[17,1],[1,19],[17,19]])g[y][x]="o";
  g[19][9]=" ";
  return{g,sx:9,sy:19};
}

function cell(x,y){return(y<0||y>=ROWS||x<0||x>=COLS)?"#":grid[y][x];}

function passWolf(x,y,m){const c=cell(x,y);if(c==="#")return false;if(c==="-"||c==="W")return m==="home"||m==="leave";return true;}
function bfs(sx,sy,pass){
  const d=new Array(COLS*ROWS).fill(1e9);if(sx<0||sy<0||sx>=COLS||sy>=ROWS)return d;
  const q=[[sx,sy]];d[sy*COLS+sx]=0;let i=0;
  while(i<q.length){const[x,y]=q[i++];const cd=d[y*COLS+x];
    for(const[dx,dy]of DLIST){const nx=x+dx,ny=y+dy;if(nx<0||ny<0||nx>=COLS||ny>=ROWS||!pass(nx,ny))continue;const k=ny*COLS+nx;if(d[k]>cd+1){d[k]=cd+1;q.push([nx,ny]);}}}

  hill(.6,H*.03,"#4a8a3a",.5);hill(.68,H*.025,"#6fae47",3);
  c.fillStyle="#2b5a22";for(let i=0;i<9;i++){const x=(i/8)*W,y=H*.66+((i*37)%20);circ(c,x,y,22);circ(c,x+18,y+6,16);}
  // personnages
  const s=Math.min(W*.32,H*.2);
  c.save();c.translate(W*.36,H*.72+Math.sin(t*3)*3);drawCarineBig(c,s,t);c.restore();
  c.save();c.translate(W*.62,H*.75);drawDog(c,s*.95,-1,t,false,S.dog,false);c.restore();
  for(let i=0;i<3;i++){const gx=W*(.12+i*.33)+Math.sin(t*1.5+i)*6,gy=H*(.8+(i%2)*.04);c.save();c.translate(gx,gy+Math.abs(Math.sin(t*4+i))*-4);const rr2=s*.12;
    c.fillStyle="#fffdf6";ell(c,0,0,rr2*1.3,rr2);c.fillStyle="#6b4a2e";circ(c,rr2*1.1,-rr2*.5,rr2*.6);c.restore();}
  // titre
  const fs=Math.min(W*.13,64);c.textAlign="center";c.textBaseline="middle";c.lineJoin="round";
  c.font="700 "+fs+"px Fredoka,sans-serif";const ty=H*.16+Math.sin(t*2)*4;
  c.lineWidth=fs*.22;c.strokeStyle="#7a2e00";c.strokeText("Carine",W/2,ty);c.fillStyle="#ffd34a";c.fillText("Carine",W/2,ty);
  c.font="700 "+fs*.55+"px Fredoka,sans-serif";c.lineWidth=fs*.14;c.strokeText("dans le maquis",W/2,ty+fs*.75);c.fillStyle="#fff";c.fillText("dans le maquis",W/2,ty+fs*.75);
  requestAnimationFrame(drawTitle);
}
function goTitle(){screen="title";musStop();showScreen("title");titleOn=true;requestAnimationFrame(drawTitle);}
on("tplay",()=>{titleOn=false;goMap();if(!S.welcomed)dogPicker(true);else daily();});
function fsSupported(){const d=document.documentElement;return!!(d.requestFullscreen||d.webkitRequestFullscreen);}
function goFS(){const d=document.documentElement;try{(d.requestFullscreen||d.webkitRequestFullscreen).call(d);}catch(e){}}
if(!fsSupported())$("tfs").style.display="none";
on("tfs",goFS);
on("bhome",()=>goTitle());
/* carte */
let chap=0;
function goMap(){screen="map";state="idle";musStop();showScreen("map");chap=Math.floor((S.unlocked-1)/PER);renderMap(true);}
function renderMap(scroll){
  refreshTop();const t=THEMES[chap%THEMES.length];
  $("chapname").innerHTML=chapName(chap)+"<small>Chapitre "+(chap+1)+" / "+(MAXL/PER)+" · niveaux "+(chap*PER+1)+"–"+(chap*PER+PER)+"</small>";
  $("cprev").disabled=chap<=0;$("cnext").disabled=chap>=MAXL/PER-1;
  $("path").style.background="linear-gradient(#8fd3ff 0%,"+t.grass+" 18%,"+t.bg[0]+" 100%)";
  const GAP=96,H=PER*GAP+170;const pin=$("pathin");pin.style.height=H+"px";
  const pts=[];let html="";
  for(let i=0;i<PER;i++){const n=chap*PER+i+1;const top=H-(i*GAP+80);const left=50+Math.sin(i*1.05)*28;pts.push(left+","+top);
    const lock=n>S.unlocked,isCur=n===S.unlocked,c=cfg(n);const st=S.stars[n]||0;
    html+=`<button class="node${lock?" lock":""}${isCur?" cur":""}${c.hard?" hard":""}" style="left:${left}%;top:${top}px" data-n="${n}">${lock?"🔒":n}${c.hard&&!lock?'<span class="sk">💀</span>':""}${st?`<span class="st">${"⭐".repeat(st)}</span>`:""}</button>`;}
  const R=rng(chap*101+7);
  for(let i=0;i<14;i++){const top=R()*(H-60)+20,side=R()<.5;const left=side?R()*14+1:R()*14+82;html+=`<span class="deco" style="top:${top}px;left:${left}%">${t.deco[R()*t.deco.length|0]}</span>`;}
  for(let k=0;k<Math.ceil(H/420);k++){const top=k*420+160,c1=t.hedge,c2=t.hl[0];
    html+=`<svg class="hills" style="top:${top}px;height:260px" viewBox="0 0 100 60" preserveAspectRatio="none"><path d="M0 30 Q15 ${8+R()*10} 30 26 T60 ${18+R()*10} T100 22 V60 H0Z" fill="${c2}" opacity=".55"/><path d="M0 42 Q20 ${26+R()*8} 45 38 T100 34 V60 H0Z" fill="${c1}" opacity=".6"/></svg>`;}
  const claimed=S.unlocked>chap*PER+PER;
  html+=`<div class="chest" style="top:12px;opacity:${claimed?.5:1}"><b>🎁</b>${claimed?"Coffre ouvert":"Coffre : +100 🪙"}</div>`;
  html=`<svg class="line" viewBox="0 0 100 ${H}" preserveAspectRatio="none"><polyline points="${pts.join(" ")}" fill="none" stroke="#fff8e0" stroke-width="10" stroke-dasharray="1 16" stroke-linecap="round" vector-effect="non-scaling-stroke"/></svg>`+html;
  pin.innerHTML=html;
  pin.querySelectorAll(".node").forEach(b=>b.onclick=()=>{auInit();SFX.click();const n=+b.dataset.n;if(n<=S.unlocked)openLevel(n);else SFX.boing();});
  if(scroll){const p=$("path");const i=Math.min(PER-1,Math.max(0,S.unlocked-1-chap*PER));const inChap=S.unlocked>chap*PER&&S.unlocked<=chap*PER+PER;
    requestAnimationFrame(()=>{p.scrollTop=inChap?(H-(i*GAP+80))-p.clientHeight/2:H;});}
}
on("cprev",()=>{if(chap>0){chap--;renderMap(true);}});
on("cnext",()=>{if(chap<MAXL/PER-1){chap++;renderMap(true);}});
on("bsnd",()=>setSound(!S.snd));
on("bdog",()=>dogPicker(false));
on("bpause",pauseGame);
function dogPicker(first){
  modal(`<h2>${first?"🐐 Carine dans le maquis":"Choisis ton chien"}</h2>
    ${first?"<p>Aide Carine à ramener les chèvres dans le maquis corse… sans te faire attraper par les loups !</p><p>✨ Les <b>os magiques dorés</b> font grandir ton chien : il part croquer les loups !</p><p>5000 niveaux t'attendent à travers toute la Corse.</p>":""}
    <div class="dogs"><button class="dog" data-k="paco"><canvas></canvas>Paco</button><button class="dog" data-k="masca"><canvas></canvas>Mascarella</button></div>
    <button class="btn ad" id="mtest">🔊 Tester la voix de Carine</button>
    <button class="btn" id="mok">${first?"C'est parti !":"OK"}</button>`);
  on("mtest",()=>{if(!S.snd)setSound(true);loadClips();setTimeout(()=>{if(!playClip("Vas-y mon Loulou !"))say("Vas-y mon Loulou !",true);},clipCache["Vas-y mon Loulou !"]&&clipCache["Vas-y mon Loulou !"]!=="loading"?0:400);});
  document.querySelectorAll(".dog").forEach(b=>{const c=b.querySelector("canvas"),r=Math.min(3,window.devicePixelRatio||1);c.width=84*r;c.height=84*r;
    const x=c.getContext("2d");x.setTransform(r,0,0,r,0,0);x.translate(40,46);drawDog(x,66,1,0,false,b.dataset.k,false);
    b.classList.toggle("sel",b.dataset.k===S.dog);b.onclick=()=>{auInit();SFX.bleat();S.dog=b.dataset.k;save();document.querySelectorAll(".dog").forEach(d=>d.classList.toggle("sel",d.dataset.k===S.dog));};});
  on("mok",()=>{S.welcomed=true;save();closeModal();daily();});
}
function daily(){
  const today=new Date().toISOString().slice(0,10);if(S.lastDaily===today)return;
  const y=new Date(Date.now()-864e5).toISOString().slice(0,10);
  S.streak=S.lastDaily===y?Math.min(7,S.streak+1):1;S.lastDaily=today;
  const gifts=[20,30,40,50,60,80,150];const g=gifts[S.streak-1];S.coins+=g;save();refreshTop();
  modal(`<h2>🎁 Cadeau du jour</h2><p>Jour ${S.streak} / 7</p><div class="big">+${g} 🪙</div><p class="tip">Reviens chaque jour : le cadeau grossit jusqu'à 150 🪙 le 7ᵉ jour !</p><button class="btn" id="mok2">Merci !</button>`);
  SFX.coin();on("mok2",closeModal);
}
/* commandes */
let sx=null,sy=null;
window.addEventListener("touchstart",e=>{const t=e.touches[0];sx=t.clientX;sy=t.clientY;},{passive:true});
["touchend","click"].forEach(ev=>window.addEventListener(ev,()=>{auInit();},{passive:true}));
window.addEventListener("touchmove",e=>{
  if(screen!=="game"||$("modal").classList.contains("on"))return;e.preventDefault();
  if(sx===null)return;const t=e.touches[0];const dx=t.clientX-sx,dy=t.clientY-sy;
  if(Math.max(Math.abs(dx),Math.abs(dy))>14){setWant(Math.abs(dx)>Math.abs(dy)?(dx>0?"R":"L"):(dy>0?"D":"U"));sx=t.clientX;sy=t.clientY;}
},{passive:false});
window.addEventListener("touchend",()=>{sx=sy=null;});
window.addEventListener("keydown",e=>{const m={ArrowLeft:"L",ArrowRight:"R",ArrowUp:"U",ArrowDown:"D",a:"L",d:"R",w:"U",s:"D",q:"L",z:"U"}[e.key];if(m&&screen==="game"){setWant(m);e.preventDefault();}if(e.key==="Escape"&&screen==="game")pauseGame();});
window.addEventListener("resize",()=>{if(screen==="game")resize();});
document.addEventListener("visibilitychange",()=>{if(document.hidden&&screen==="game")pauseGame();});
setInterval(()=>{if(screen==="map")refreshTop();},1000);

setSound(S.snd);goTitle();
try{if("serviceWorker" in navigator&&location.protocol==="https:")navigator.serviceWorker.register("sw.js");}catch(e){}
requestAnimationFrame(loop);
window.__icon=(n)=>{const c=document.createElement("canvas");c.width=c.height=n;const x=c.getContext("2d");
  const g=x.createLinearGradient(0,0,0,n);g.addColorStop(0,"#f28b6b");g.addColorStop(.55,"#ffcf7a");g.addColorStop(.56,"#6fae47");g.addColorStop(1,"#3f7d2c");x.fillStyle=g;x.fillRect(0,0,n,n);
  x.fillStyle="rgba(255,240,200,.95)";circ(x,n*.74,n*.3,n*.12);
  x.fillStyle="#6a4f7a";x.beginPath();x.moveTo(0,n*.56);x.lineTo(n*.25,n*.36);x.lineTo(n*.5,n*.5);x.lineTo(n*.72,n*.4);x.lineTo(n,n*.56);x.closePath();x.fill();
  x.save();x.translate(n*.36,n*.6);drawCarineBig(x,n*.55,0);x.restore();
  x.save();x.translate(n*.72,n*.74);drawDog(x,n*.5,-1,0,false,"paco",false);x.restore();
  return c.toDataURL("image/png");};
window.__t={cfg,genMaze,get state(){return state},get S(){return S},setWant,startLevel:n=>{booster={};startLevel(n);},
  forceWin:()=>{if(state==="play"){itemsLeft=0;state="clear";timer=.1;}},magic:()=>startPower(false),get dog(){return dog},get wolves(){return wolves}};
})();
